## ======================== Basic Settings ======================== ##

display_language: "en"

api:
  key: 'YOUR_GEMINI_API_KEY'
  keys:
  - 'YOUR_GEMINI_API_KEY_1'
  - 'YOUR_GEMINI_API_KEY_2'
  - 'YOUR_GEMINI_API_KEY_3'
  base_url: 'https://generativelanguage.googleapis.com/v1beta/openai'
  model: 'gemini-3.1-flash-lite'
  llm_support_json: true
max_workers: 4

target_language: 'Tiếng Việt'
subtitle_source: 'whisper'

demucs: false

ocr_region:
  top: 0.7446489396656203
  bottom: 0.809438092263176
  left: 0.073258529834533
  right: 0.913258529834533
whisper:
  model: 'large-v3'
  language: 'zh'
  detected_language: 'zh'
  runtime: 'local'
  whisperX_302_api_key: 'YOUR_WHISPERX_API_KEY'
  elevenlabs_api_key: 'YOUR_ELEVENLABS_API_KEY'

burn_subtitles: true

## ======================== Advanced Settings ======================== ##

ffmpeg_gpu: true
ffmpeg_threads: 4
vram_threshold_mb: 4000

background_music_volume: 1.0

subtitle_style: white_black

subtitle_position: null

youtube:
  cookies_path: ''

ytb_resolution: '1080'

subtitle:
  max_length: 75
  target_multiplier: 1.2

summary_length: 8000
max_split_length: 20
reflect_translate: true
pause_before_translate: false
split_align_batch_size: 150

## ======================== Dubbing Settings ========================  ##

tts_method: 'custom_tts'

sf_fish_tts:
  api_key: 'YOUR_FISH_TTS_API_KEY'
  voice: 'anna'
  custom_name: ''
  voice_id: ''
  mode: "preset"

openai_tts:
  api_key: 'YOUR_OPENAI_API_KEY'
  voice: 'alloy'

azure_tts:
  api_key: 'YOUR_AZURE_API_KEY'
  voice: 'vi-VN-HoaiMyNeural'

fish_tts:
  api_key: 'YOUR_FISH_TTS_API_KEY'
  character: ''
  character_id_dict: {}

sf_cosyvoice2:
  api_key: 'YOUR_COSYVOICE_API_KEY'

edge_tts:
  voice: 'vi-VN-HoaiMyNeural'

gpt_sovits:
  character: ''
  refer_mode: 3

f5tts:
  302_api: 'YOUR_302_API_KEY'

speed_factor:
  min: 1
  accept: 1.2
  max: 1.4

min_subtitle_duration: 2.5
min_trim_duration: 3.5
tolerance: 1.5

## ======================== Additional settings ======================== ##

model_dir: 'D:/project/pyhon/VideoLingo/_model_cache'
allowed_video_formats:
- 'mp4'
- 'mov'
- 'avi'
- 'mkv'
- 'flv'
- 'wmv'
- 'webm'

allowed_audio_formats:
- 'wav'
- 'mp3'
- 'flac'
- 'm4a'

spacy_model_map:
  en: 'en_core_web_md'
  ru: 'ru_core_news_md'
  fr: 'fr_core_news_md'
  ja: 'ja_core_news_md'
  es: 'es_core_news_md'
  de: 'de_core_news_md'
  it: 'it_core_news_md'
  zh: 'zh_core_web_md'

language_split_with_space:
- 'en'
- 'es'
- 'fr'
- 'de'
- 'it'
- 'ru'

language_split_without_space:
- 'zh'
- 'ja'

## ======================== VieNeu TTS ======================== ##

vieneu:
  mode: "v3turbo"
  voice: "Trúc Ly"
  hf_home: "D:/hf_cache"

## ======================== OCR Lines (core/ocr_lines.py) ======================== ##
translate_max_sentences_per_chunk: 150
translate_chunk_size_chars: 999999
src_pipeline:
  pipeline_goc_chunk_size: 150
  portrait_font_size: 10
  ocr_tts_split_max_chars: 200
  ocr_min_subtitle_duration: 0.8
  syllable_rate: 4.0