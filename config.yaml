## ======================== Basic Settings ======================== ##

display_language: "en"

# API settings
api:
  key: 'YOUR_GEMINI_API_KEY'
  keys:
  - 'YOUR_GEMINI_API_KEY_1'
  - 'YOUR_GEMINI_API_KEY_2'
  - 'YOUR_GEMINI_API_KEY_3'
#  key: 'YOUR_GROQ_API_KEY'
  base_url: 'https://generativelanguage.googleapis.com/v1beta/openai'
#  base_url: 'https://api.groq.com/openai/v1'
  model: 'gemini-3.1-flash-lite'
#  model: 'qwen/qwen3-32b'
#  model: 'meta-llama/llama-4-scout-17b-16e-instruct'
  llm_support_json: true
max_workers: 2

target_language: 'Tiếng Việt'
subtitle_source: 'whisper'

demucs: false

ocr_region:
  top: 0.7446489396656203
  bottom: 0.809438092263176
  left: 0.073258529834533
  right: 0.913258529834533
whisper:
  model: 'medium'
  language: 'zh'
  detected_language: 'zh'
  runtime: 'local'
  whisperX_302_api_key: ''
  elevenlabs_api_key: ''

burn_subtitles: true

## ======================== Advanced Settings ======================== ##

ffmpeg_gpu: true
# Limit FFmpeg thread count
ffmpeg_threads: 4
# (24GB -> 20000, 16GB -> ~13000, ...).
vram_threshold_mb: 4000

background_music_volume: 1.0

youtube:
  cookies_path: ''

ytb_resolution: '1080'

subtitle:
  max_length: 75
  target_multiplier: 1.2

summary_length: 8000
max_split_length: 20
reflect_translate: true
pause_before_translate: false

## ======================== Dubbing Settings ========================  ##
#qwen/qwen3-32b
tts_method: 'custom_tts'

sf_fish_tts:
  api_key: ''
  voice: 'anna'
  custom_name: ''
  voice_id: ''
  mode: "preset"

openai_tts:
  api_key: ''
  voice: 'alloy'

azure_tts:
  api_key: ''
  voice: 'vi-VN-HoaiMyNeural'

fish_tts:
  api_key: ''
  character: ''
  character_id_dict: {}

sf_cosyvoice2:
  api_key: ''

edge_tts:
  voice: 'vi-VN-HoaiMyNeural'

gpt_sovits:
  character: ''
  refer_mode: 3

f5tts:
  302_api: ''

speed_factor:
  min: 1
  accept: 1.2
  max: 1.4

min_subtitle_duration: 2.5
min_trim_duration: 3.5
tolerance: 1.5

## ======================== Additional settings ======================== ##

#model_dir: './_model_cache'
model_dir: 'YOUR_LOCAL_MODEL_DIR_PATH'
allowed_video_formats:
- 'mp4'
- 'mov'
- 'avi'
- 'mkv'
- 'flv'
- 'wmv'
- 'webm'

allowed_audio_formats:
- 'wav'
- 'mp3'
- 'flac'
- 'm4a'

spacy_model_map:
  en: 'en_core_web_md'
  ru: 'ru_core_news_md'
  fr: 'fr_core_news_md'
  ja: 'ja_core_news_md'
  es: 'es_core_news_md'
  de: 'de_core_news_md'
  it: 'it_core_news_md'
  zh: 'zh_core_web_md'

language_split_with_space:
- 'en'
- 'es'
- 'fr'
- 'de'
- 'it'
- 'ru'

language_split_without_space:
- 'zh'
- 'ja'

## ======================== VieNeu TTS ======================== ##

vieneu:
  mode: "v3turbo"
  voice: "Trúc Ly"
  hf_home: "YOUR_LOCAL_HF_HOME_PATH"

## ======================== ZH Pipeline ======================== ##
translate_max_sentences_per_chunk: 150
translate_chunk_size_chars: 999999
zh_pipeline:
  gemini_api_key: 'YOUR_GEMINI_API_KEY_1, YOUR_GEMINI_API_KEY_2'
  gemini_model: 'gemini-3.1-flash-lite'
  translate_engine: 'pipeline_goc'
  pipeline_goc_chunk_size: 150
  whisper_model_zh: 'medium'
  demucs_for_vad: true
  demucs_model: 'htdemucs'
  portrait_font_size: 10
  tts_split_max_chars: 42
  ocr_tts_split_max_chars: 200
  no_speech_threshold: 0.95
  ocr_min_subtitle_duration: 0.8
  syllable_rate: 4.0
  merge_min_zh_duration: 1.2
  merge_max_zh_gap: 0.5