## ======================== Basic Settings ======================== ##

display_language: "en"

# API settings
api:
  key: 'YOUR_API_KEY'
  keys:
  - 'YOUR_API_KEY_1'
  - 'YOUR_API_KEY_2'
  - 'YOUR_API_KEY_3'
#  key: 'YOUR_API_KEY_OLD'
  base_url: 'https://generativelanguage.googleapis.com/v1beta/openai'
#  base_url: 'https://api.groq.com/openai/v1'
  model: 'gemini-3.1-flash-lite'
#  model: 'qwen/qwen3-32b'
#  model: 'meta-llama/llama-4-scout-17b-16e-instruct'
  llm_support_json: true
max_workers: 1

target_language: 'Tiếng Việt'
subtitle_source: 'ocr'

demucs: false

whisper:
  model: 'medium'
  language: 'zh'
  detected_language: 'en'
  runtime: 'local'
  whisperX_302_api_key: 'YOUR_API_KEY'
  elevenlabs_api_key: 'YOUR_API_KEY'

burn_subtitles: true

## ======================== Advanced Settings ======================== ##

ffmpeg_gpu: false

youtube:
  cookies_path: ''

ytb_resolution: '1080'

subtitle:
  max_length: 75
  target_multiplier: 1.2

summary_length: 8000
max_split_length: 20
reflect_translate: true
pause_before_translate: false

## ======================== Dubbing Settings ========================  ##
#qwen/qwen3-32b
tts_method: 'custom_tts'

sf_fish_tts:
  api_key: 'YOUR_API_KEY'
  voice: 'anna'
  custom_name: ''
  voice_id: ''
  mode: "preset"

openai_tts:
  api_key: 'YOUR_API_KEY'
  voice: 'alloy'

azure_tts:
  api_key: 'YOUR_API_KEY'
  voice: 'vi-VN-HoaiMyNeural'

fish_tts:
  api_key: 'YOUR_API_KEY'
  character: ''
  character_id_dict: {}

sf_cosyvoice2:
  api_key: 'YOUR_API_KEY'

edge_tts:
  voice: 'vi-VN-HoaiMyNeural'

gpt_sovits:
  character: ''
  refer_mode: 3

f5tts:
  302_api: 'YOUR_API_KEY'

speed_factor:
  min: 1
  accept: 1.2
  max: 1.4

min_subtitle_duration: 2.5
min_trim_duration: 3.5
tolerance: 1.5

## ======================== Additional settings ======================== ##

model_dir: './_model_cache'

allowed_video_formats:
- 'mp4'
- 'mov'
- 'avi'
- 'mkv'
- 'flv'
- 'wmv'
- 'webm'

allowed_audio_formats:
- 'wav'
- 'mp3'
- 'flac'
- 'm4a'

spacy_model_map:
