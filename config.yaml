## ======================== Basic Settings ======================== ##

display_language: "en"

# API settings
api:
  key: 'YOUR_KEY_HERE'
  keys:
    - 'YOUR_KEY_HERE'
    - 'YOUR_KEY_HERE'
    - 'YOUR_KEY_HERE'
  # key: 'YOUR_KEY_HERE'
  base_url: 'YOUR_BASE_URL'
  # base_url: 'YOUR_BASE_URL'
  model: 'YOUR_MODEL'
  # model: 'YOUR_MODEL'
  # model: 'YOUR_MODEL'
  llm_support_json: true
max_workers: 1

target_language: 'Tiếng Việt'

demucs: false

whisper:
  model: 'medium'
  language: 'zh'
  detected_language: 'zh'
  runtime: 'local'
  whisperX_302_api_key: ''
  elevenlabs_api_key: ''

burn_subtitles: true

## ======================== Advanced Settings ======================== ##

ffmpeg_gpu: false

youtube:
  cookies_path: ''

ytb_resolution: '1080'

subtitle:
  max_length: 75
  target_multiplier: 1.2

summary_length: 8000
max_split_length: 20
reflect_translate: true
pause_before_translate: false

## ======================== Dubbing Settings ========================  ##
#qwen/qwen3-32b
tts_method: 'custom_tts'

sf_fish_tts:
  api_key: ''
  voice: 'anna'
  custom_name: ''
  voice_id: ''
  mode: "preset"

openai_tts:
  api_key: ''
  voice: 'alloy'

azure_tts:
  api_key: ''
  voice: 'vi-VN-HoaiMyNeural'

fish_tts:
  api_key: ''
  character: ''
  character_id_dict: {}

sf_cosyvoice2:
  api_key: ''

edge_tts:
  voice: 'vi-VN-HoaiMyNeural'

gpt_sovits:
  character: ''
  refer_mode: 3

f5tts:
  302_api: ''

speed_factor:
  min: 1
  accept: 1.2
  max: 1.4

min_subtitle_duration: 2.5
min_trim_duration: 3.5
tolerance: 1.5

## ======================== Additional settings ======================== ##

model_dir: './_model_cache'

allowed_video_formats:
- 'mp4'
- 'mov'
- 'avi'
- 'mkv'
- 'flv'
- 'wmv'
- 'webm'

allowed_audio_formats:
- 'wav'
- 'mp3'
- 'flac'
- 'm4a'

spacy_model_map:
  en: 'en_core_web_md'
  ru: 'ru_core_news_md'
  fr: 'fr_core_news_md'
  ja: 'ja_core_news_md'
  es: 'es_core_news_md'
  de: 'de_core_news_md'
  it: 'it_core_news_md'
  zh: 'zh_core_web_md'

language_split_with_space:
- 'en'
- 'es'
- 'fr'
- 'de'
- 'it'
- 'ru'

language_split_without_space:
- 'zh'
- 'ja'

## ======================== VieNeu TTS ======================== ##

vieneu:
  mode: "v3turbo"
  voice: "Trọng Hữu"
  hf_home: "D:/hf_cache"

## ======================== ZH Pipeline ======================== ##
# Chỉ dùng khi whisper.language = 'zh'
# Pipeline riêng cho tiếng Trung: VAD + faster-whisper clip + Gemini dịch duration-aware
# Bypass hoàn toàn WhisperX alignment (wav2vec2-zh hay fail) + spaCy ZH split

zh_pipeline:
  gemini_api_key: 'YOUR_API_KEY'
  gemini_model: 'gemini-3.1-flash-lite'
  whisper_model_zh: 'medium'
  demucs_for_vad: true
  demucs_model: 'htdemucs'
