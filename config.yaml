- 'ja'

## ======================== VieNeu TTS ======================== ##

vieneu:
  mode: "v3turbo"
  voice: "Trúc Ly"
  hf_home: "D:/hf_cache"

## ======================== ZH Pipeline ======================== ##
# Chỉ dùng khi whisper.language = 'zh'
# Pipeline riêng cho tiếng Trung: VAD + faster-whisper clip + Gemini dịch duration-aware
# Bypass hoàn toàn WhisperX alignment (wav2vec2-zh hay fail) + spaCy ZH split

zh_pipeline:
  gemini_api_key: 'YOUR_API_KEY'
  gemini_model: 'gemini-3.1-flash-lite'
  whisper_model_zh: 'medium'
  demucs_for_vad: true
  demucs_model: 'htdemucs'
  # Video dọc (portrait/short: cao > rộng) -> chữ nhỏ lại cho đỡ che video (không đổi độ dài sub)
  portrait_font_size: 10
  # Ngưỡng ký tự để tách 1 câu dịch thành nhiều dòng khi TTS đọc (ưu tiên cắt tại dấu câu/phẩy).
  # Tăng lên nếu thấy TTS bị khựng/ngắt hơi nhiều giữa câu; giảm xuống nếu sub hiện quá dài/trễ so với thoại.
  tts_split_max_chars: 200
  no_speech_threshold: 0.95
  ocr_min_subtitle_duration: 1.2
  syllable_rate: 4.0